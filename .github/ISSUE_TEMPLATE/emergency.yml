name: Emergency release
description: Request an announcement for an urgent mod update.
title: '[Emergency] '
body:
  - type: input
    id: mod
    attributes:
      label: Mod
      placeholder: Team-ModName
      description: Your GitHub account must be verified for this Thunderstore team.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.2.3
      description: The latest published version.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Why does this update need an immediate announcement? Maximum 1000 characters. One request per mod every seven days.
    validations:
      required: true
